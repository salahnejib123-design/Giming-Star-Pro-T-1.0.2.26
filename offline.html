<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070a24">
<title>Master Ludo</title>
<style>
  :root { --gold: #ffd23a; --pink: #ff5ecb; --violet: #7a5cff; --ink: #f4f1ff; --muted: #b8c0ea; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px 16px;
    font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif; color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, #2a1b78 0%, #0d0a33 45%, #05031a 100%);
    overflow: hidden;
  }
  body::before, body::after {               /* soft neon orbs */
    content: ""; position: fixed; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(60px); opacity: .35; z-index: 0;
  }
  body::before { background: var(--violet); top: -30vmax; inset-inline-start: -25vmax; }
  body::after { background: var(--pink); bottom: -35vmax; inset-inline-end: -25vmax; }
  .card {
    position: relative; z-index: 1; width: min(420px, 100%); text-align: center;
    padding: 34px 26px 28px; border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .logo { width: 104px; height: 104px; margin: 0 auto 14px; display: block; filter: drop-shadow(0 0 22px rgba(255,94,203,.55)); }
  .brand { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: .4px; color: var(--gold); }
  h1 { margin: 22px 0 8px; font-size: 1.35rem; font-weight: 800; }
  p { margin: 0; color: var(--muted); line-height: 1.7; font-size: .98rem; }
  .wifi { width: 46px; height: 46px; margin: 0 auto 6px; display: block; }
  .btn {
    margin-top: 26px; width: 100%; height: 56px; border: 0; border-radius: 18px; cursor: pointer;
    font: inherit; font-size: 1.1rem; font-weight: 800; color: #2a1800;
    background: linear-gradient(90deg, #ffe27a, #ffd23a 45%, #ffb347);
    box-shadow: 0 10px 30px rgba(255,210,58,.35), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .12s ease, filter .2s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .btn.busy { filter: saturate(.7); }
  .note {
    position: fixed; top: 14px; inset-inline: 14px; z-index: 2; margin: 0 auto; max-width: 420px;
    padding: 12px 16px; border-radius: 16px; text-align: center; font-weight: 700; font-size: .95rem;
    background: rgba(255, 94, 203, .16); border: 1px solid rgba(255, 94, 203, .55); color: #ffe1f4;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transform: translateY(-140%); transition: transform .35s ease;
  }
  .note.on { transform: translateY(0); }
  .hint { margin-top: 14px; font-size: .85rem; color: #8f98cc; min-height: 1.4em; }
</style>
</head>
<body>
  <div class="note" id="note" role="status" aria-live="polite">فعّل الإنترنت ثم اضغط إعادة المحاولة</div>
  <main class="card" role="alert">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".55" stop-color="#ff7ac8"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
      </defs>
      <polygon points="60,8 72.6,43.2 110,44.6 80.4,67.3 90.8,103.2 60,81.5 29.2,103.2 39.6,67.3 10,44.6 47.4,43.2" fill="url(#g)" stroke="#fff3b8" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="60" cy="58" r="9" fill="#1b1450"/>
    </svg>
    <p class="brand">Master Ludo</p>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من تشغيل الواي فاي أو بيانات الهاتف، ثم اضغط على الزر لمتابعة اللعب.</p>
    <button class="btn" id="retry" type="button">إعادة المحاولة</button>
    <p class="hint" id="hint"></p>
  </main>
<script>
(function () {
  var btn = document.getElementById('retry'), note = document.getElementById('note'), hint = document.getElementById('hint');
  var busy = false;
  function showNote(on) { note.classList.toggle('on', !!on); }
  function enter() { location.replace('./'); }
  function check() {
    if (!navigator.onLine) return Promise.resolve(false);
    return fetch('./index.html', { cache: 'no-store' }).then(function (r) { return r.ok; }).catch(function () { return false; });
  }
  btn.addEventListener('click', function () {
    if (busy) return; busy = true; btn.classList.add('busy'); btn.disabled = true; hint.textContent = 'جارٍ الاتصال…';
    check().then(function (ok) {
      if (ok) { hint.textContent = 'تم الاتصال، جارٍ الدخول…'; enter(); return; }
      busy = false; btn.classList.remove('busy'); btn.disabled = false; hint.textContent = '';
      showNote(true);
    });
  });
  window.addEventListener('online', function () { showNote(false); hint.textContent = 'عادت الإنترنت، اضغط إعادة المحاولة'; });
  window.addEventListener('offline', function () { showNote(true); });
  if (!navigator.onLine) showNote(true);
})();
</script>
</body>
</html>
